name: frp_gui
description: "A cross-platform desktop FRP GUI management client built with Flutter."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.0.2
  dio: ^5.8.0
  dynamic_color: ^1.8.1
  shared_preferences: ^2.5.5
  system_theme: ^3.2.0
  toml: ^0.18.0
  window_manager: ^0.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
